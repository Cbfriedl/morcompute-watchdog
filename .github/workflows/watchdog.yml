# Deploy to a PUBLIC repo as .github/workflows/watchdog.yml
#
# Required repo secret:
#   NTFY_TOPIC        - the ntfy topic to alert to
# Required repo variables (Settings -> Secrets and variables -> Actions -> Variables):
#   PROVIDER_ADDRESS  - 0x...
#   PROVIDER_ENDPOINT - host:port fallback, used only if the chain read fails
#
# Nothing here is a credential belonging to the provider box. The provider
# address and endpoint are already public in on-chain history, so keeping this
# repo public costs no additional exposure — and public repos get unlimited
# Actions minutes.

name: Morpheus watchdog

on:
  schedule:
    # 13 is deliberate: coprime with the on-box monitor's 10-minute period, so
    # the two layers stay maximally out of phase instead of beating together.
    #
    # CAVEAT: cron cannot express a true 13-minute period. "*/13" fires at
    # :00 :13 :26 :39 :52 and then RESETS at the hour, so the last gap is 8
    # minutes, not 13. Full independence is not achievable in cron because 13
    # does not divide 60. In practice this does not matter much: GitHub delays
    # scheduled runs by several minutes and unpredictably, and the on-box timer
    # is free-running (OnUnitActiveSec + 45s jitter) rather than wall-clock
    # aligned, so the two drift relative to each other anyway.
    #
    # GitHub also disables schedules after 60 days of repo inactivity.
    - cron: "*/13 * * * *"
  workflow_dispatch: {}

concurrency:
  group: watchdog
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Run watchdog
        env:
          PROVIDER_ADDRESS: ${{ vars.PROVIDER_ADDRESS }}
          PROVIDER_ENDPOINT: ${{ vars.PROVIDER_ENDPOINT }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          HEADROOM_WARN_PCT: "30"
        run: python3 watchdog/watchdog.py
