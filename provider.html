<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Provider lookup — Morpheus census</title>
<meta name="description" content="Look up any Morpheus provider: its stake, headroom, live bids, realised earnings and who actually buys from it.">
<link rel="stylesheet" href="assets/pub.css?v=9b01a33aaaab">

<div class="wrap">
  <header>
    <div class="eyebrow">Base mainnet · full chain census</div>
    <h1>Provider lookup</h1>
    <p class="standfirst">
      Search any provider address, or arrive here by clicking one on the earnings
      chart, in a model's bidder list, or in the address table. Everything shown
      is public chain state.
    </p>
  </header>

  <div id="navslot"></div>
  <div class="warnbox" id="err" style="display:none"></div>

  <div class="toolbar">
    <input type="search" id="q" list="plist" placeholder="paste or type an address…"
           aria-label="Provider address" style="min-width:360px">
    <datalist id="plist"></datalist>
    <button id="clear">Clear</button>
    <span class="selcount" id="msg"></span>
  </div>

  <div id="body"></div>

  <footer id="foot"></footer>
</div>
<div id="tip" role="status" aria-live="polite"></div>

<script type="module">
import {DIAMOND,CHOKE,fmt,int,pct,mor,price,short,day,
        nav,kpi,esc,census,wireTip,hbar} from "./assets/pub.js?v=df8223ececa9";

document.getElementById("navslot").innerHTML = nav("provider.html");
let C, H;
try { C = await census(); }
catch(e){ const el=document.getElementById("err"); el.style.display="";
  el.innerHTML="<b>Could not load census-full.json.</b> "+esc(e.message); throw e; }
try { H = await (await fetch("providers-history.json?cb="+Date.now())).json(); } catch(e){ H=null; }

const PD = C.pdetail || {}, HP = H?.providers || {};

/* Union of both sources: a provider can appear in the history with no live bid
   (it stopped bidding) or in the census with no history (it never sold). Either
   is a real answer to "look this address up" and must not 404. */
const ALL = [...new Set([...Object.keys(PD), ...Object.keys(HP)])].sort();
document.getElementById("plist").innerHTML =
  ALL.map(a=>`<option value="${esc(a)}">`).join("");

/* Model id -> name, and a per-provider list of what they currently bid. */
const MNAME = {}, MYBIDS = {};
(C.models||[]).forEach(m=>{
  MNAME[m.id] = m.n;
  (m.pv||[]).forEach(([a,p])=>{
    const k = String(a).toLowerCase();
    (MYBIDS[k] = MYBIDS[k] || []).push({n:m.n, id:m.id, p,
      s10:m.s10||0, sAll:m.sAll||0, mor10:m.mor10||0, morAll:m.morAll||0,
      mn:m.mn, bidders:m.b});
  });
});

function show(addrRaw){
  const a = String(addrRaw||"").trim().toLowerCase();
  const body = document.getElementById("body"), msg = document.getElementById("msg");
  if(!a){ body.innerHTML = intro(); msg.textContent = ALL.length+" providers on file"; return; }
  const d = PD[a], h = HP[a];
  if(!d && !h){
    body.innerHTML = "";
    msg.innerHTML = "<span style='color:var(--crit)'>no provider with that address in this census</span>";
    return;
  }
  msg.textContent = "";
  history.replaceState(null, "", "#"+a);

  const choked = d ? (d.head||0) <= CHOKE : null;
  const bids = MYBIDS[a] || [];
  const lifeDays = h?.first && h?.last ? Math.max((h.last-h.first)/86400, 1) : null;

  const cards = [
    kpi("Stake", d? mor(d.stake)+" MOR" : "—", d? "staked now":"not a live bidder","hold"),
    kpi("Headroom", d? (choked? "0" : mor(d.head)) : "—",
        d? (choked? "CHOKED — cannot be paid until it re-stakes" : "MOR still earnable") : "—",
        choked? "choke":"hold"),
    kpi("Earned / staked", d? pct(d.pct,1) : "—", "limitPeriodEarned ÷ stake", choked?"choke":"hold"),
    kpi("Live bids", d? int(d.bids) : "0",
        d? int(d.models)+" distinct models":"no live listings","hold"),
    kpi("Median bid", d? price(d.md)+"" : "—", d? price(d.mn)+" – "+price(d.mx)+" MOR/day":"—","hold"),
    kpi("Sessions, all time", h? int(h.sAll) : "—",
        lifeDays? fmt(h.sAll/lifeDays,1)+" / day since first session":"—","earn"),
    kpi("MOR earned, all time", h? mor(h.morAll) : "—",
        h&&h.sAll? fmt(h.morAll/h.sAll,4)+" MOR / session":"—","earn"),
    kpi("Sessions, 10d", h? int(h.s10) : "—", h? fmt(h.s10/10,1)+" / day":"—","earn"),
    kpi("MOR earned, 10d", h? mor(h.mor10) : "—", h? fmt(h.mor10/10,2)+" MOR / day":"—","earn"),
    kpi("Sessions today", h? int(h.s1) : "—", h? mor(h.mor1)+" MOR":"—","earn"),
    kpi("Distinct buyers", h? int(h.buyers) : "—",
        h&&h.topBuyer? "top holds "+pct(h.topShare,1):"—", h&&h.buyers===1? "choke":"hold"),
    kpi("First session", h? day(h.first) : "—", h? "last "+day(h.last):"never sold","time"),
    kpi("Registered", d? day(d.createdAt) : "—", "provider record created","time"),
  ].join("");

  /* Where this provider's own money comes from, by model. */
  const rows = (h?.rows||[]).filter(r=>r.morAll>0).slice(0,12);
  const chart = rows.length ? hbar(rows.map(r=>({
      label: r.n.length>22 ? r.n.slice(0,21)+"…" : r.n,
      value: r.morAll, color: "var(--band-low)", right: mor(r.morAll),
      tipHtml: "<span class='t'>"+esc(r.n)+"</span><br>"+
               mor(r.morAll)+" MOR all time · "+int(r.sAll)+" sessions<br>"+
               mor(r.mor10)+" MOR in 10d · "+int(r.s10)+" sessions"
    })), {aria:"MOR earned per model", padL:190, rowH:24}) : "";

  /* Live bids joined to realised demand: the point of the join is that a bid
     with no sessions behind it is a listing, not a business. */
  const bidRows = bids.slice().sort((x,y)=>y.morAll-x.morAll).map(b=>{
    const got = (h?.rows||[]).find(r=>r.n === b.n);
    return "<tr><td>"+esc(b.n)+"</td>"+
      "<td class='num'>"+price(b.p)+"</td>"+
      "<td class='num'>"+price(b.mn)+"</td>"+
      "<td class='num'>"+int(b.bidders)+"</td>"+
      "<td class='num'>"+int(b.s10)+"</td>"+
      "<td class='num'>"+(got? int(got.s10) : "0")+"</td>"+
      "<td class='num'>"+(got&&got.mor10? mor(got.mor10) : "—")+"</td></tr>";
  }).join("");

  body.innerHTML =
    "<section><div class='kpis'>"+cards+"</div></section>"+
    (choked ? "<div class='callout'><h3>This provider cannot currently be paid</h3>"+
      "<p>Its headroom is zero: <span class='mono'>limitPeriodEarned</span> has reached "+
      "<span class='mono'>stake</span>. Its bids are still live and it will still serve "+
      "requests — it simply accrues nothing until it claims and re-stakes.</p></div>" : "")+
    (chart ? "<section><h2>Where this provider earns</h2><div class='card'>"+
      "<div class='plot'>"+chart+"</div>"+
      "<p class='cap'>MOR earned per model, all time, from every closed session. "+
      "Top "+rows.length+" of "+(h.rows||[]).length+" models it has ever served.</p></div></section>" : "")+
    (bidRows ? "<section><h2>Live bids</h2><div class='tablewrap'><table>"+
      "<thead><tr><th>Model</th><th>Its bid</th><th>Cheapest bid</th><th>Bidders</th>"+
      "<th>Model demand 10d</th><th>Its sessions 10d</th><th>Its MOR 10d</th></tr></thead>"+
      "<tbody>"+bidRows+"</tbody></table></div>"+
      "<p class='cap'><strong>Model demand</strong> is every session on that model, network wide; "+
      "<strong>its sessions</strong> is the share this provider actually captured. The gap between "+
      "the two is what a bid is competing for.</p></section>"
      : "<section><p>This address holds no live bids in the current census.</p></section>");

  wireTip(body);
}

function intro(){
  const ranked = Object.entries(HP).map(([a,p])=>({a,...p}))
    .sort((x,y)=>y.morAll-x.morAll).slice(0,12);
  if(!ranked.length) return "<p>Enter an address above.</p>";
  return "<section><h2>Largest providers by lifetime MOR</h2>"+
    "<p>Pick one to start, or paste any address above.</p>"+
    "<div class='tablewrap'><table><thead><tr><th>Address</th><th>MOR all time</th>"+
    "<th>Sessions</th><th>Buyers</th><th>Live bids</th></tr></thead><tbody>"+
    ranked.map(r=>{
      const d = PD[r.a] || {};
      return "<tr><td class='mono'>"+
        "<a href='#"+esc(r.a)+"' data-go='"+esc(r.a)+"'>"+short(r.a)+"</a></td>"+
        "<td class='num'>"+mor(r.morAll)+"</td><td class='num'>"+int(r.sAll)+"</td>"+
        "<td class='num'>"+int(r.buyers)+"</td>"+
        "<td class='num'>"+int(d.bids||0)+"</td></tr>";
    }).join("")+"</tbody></table></div></section>";
}

document.getElementById("q").addEventListener("change", e=>show(e.target.value));
document.getElementById("q").addEventListener("input", e=>{
  const v = e.target.value.trim().toLowerCase();
  if(v.length === 42 || ALL.includes(v)) show(v);          /* full paste → go */
});
document.getElementById("clear").addEventListener("click", ()=>{
  document.getElementById("q").value=""; history.replaceState(null,"",location.pathname); show(""); });
document.getElementById("body").addEventListener("click", e=>{
  const a = e.target.closest("[data-go]");
  if(a){ e.preventDefault(); document.getElementById("q").value = a.dataset.go; show(a.dataset.go); }
});
addEventListener("hashchange", ()=>{
  const a = location.hash.slice(1);
  document.getElementById("q").value = a; show(a);
});

const initial = decodeURIComponent(location.hash.slice(1));
if(initial) document.getElementById("q").value = initial;
show(initial);
wireTip(document.body);

document.getElementById("foot").innerHTML =
  "Census "+esc((C.asOf||"").slice(0,10))+
  (H? " · session history "+esc(H.firstDay)+" → "+esc(H.lastDay)+", coverage "+fmt(100*H.coverage,1)+"%":"")+
  " · Diamond <span class='mono'>"+short(DIAMOND)+"…</span>"+
  " · <a href='https://github.com/Cbfriedl/morcompute-watchdog'>source</a>";
</script>
